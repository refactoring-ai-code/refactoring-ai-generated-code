name: Backend checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
permissions:
  contents: read
concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend-checks:
    name: backend-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.17'
      - name: Install pinned environment manager
        run: python -m pip install --disable-pip-version-check uv==0.13.7
      - name: Sync locked backend environment
        run: uv sync --project backend --locked
      - name: Lint backend scaffold
        run: uv run --project backend ruff check backend/app backend/tests
      - name: Test backend health surface
        run: uv run --project backend python -m pytest backend/tests
