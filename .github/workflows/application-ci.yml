name: Application stack checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infrastructure/**'
      - '.github/workflows/application-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infrastructure/**'
      - '.github/workflows/application-ci.yml'
permissions:
  contents: read
concurrency:
  group: application-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application-stack-checks:
    name: application-stack-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose -f infrastructure/compose.dev.yml config --quiet
      - name: Start pinned development stack
        run: docker compose -f infrastructure/compose.dev.yml up --build --detach --wait
      - name: Verify live application health
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/live
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:5173/
      - name: Show service diagnostics on failure
        if: failure()
        run: |
          docker compose -f infrastructure/compose.dev.yml ps
          docker compose -f infrastructure/compose.dev.yml logs --no-color
      - name: Tear down development stack
        if: always()
        run: docker compose -f infrastructure/compose.dev.yml down --volumes --remove-orphans
